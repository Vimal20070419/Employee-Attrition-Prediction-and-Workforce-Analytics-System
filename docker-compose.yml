version: "3.9"

networks:
  attrition_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ml_artifacts:
  upload_data:

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: attrition_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attrition_db}
      POSTGRES_USER: ${POSTGRES_USER:-attrition_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attrition_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    networks:
      - attrition_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attrition_user} -d ${POSTGRES_DB:-attrition_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis (Cache + Celery Broker)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: attrition_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - attrition_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # FastAPI Backend
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attrition_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ML_SERVICE_URL=http://ml_service:8001
    volumes:
      - upload_data:/app/uploads
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - attrition_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Celery Worker
  # ============================================================
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attrition_celery_worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q training,reports,shap,notifications
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ML_SERVICE_URL=http://ml_service:8001
    volumes:
      - upload_data:/app/uploads
      - ml_artifacts:/app/artifacts
      - ./backend:/app
    networks:
      - attrition_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ============================================================
  # Celery Beat Scheduler
  # ============================================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attrition_celery_beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
    networks:
      - attrition_network
    depends_on:
      - celery

  # ============================================================
  # Celery Flower (Monitoring)
  # ============================================================
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attrition_flower
    restart: unless-stopped
    command: celery -A app.celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-admin:flower_admin}
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "5555:5555"
    networks:
      - attrition_network
    depends_on:
      - celery

  # ============================================================
  # ML Service
  # ============================================================
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: attrition_ml_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ml_artifacts:/app/artifacts
      - upload_data:/app/uploads
      - ./ml_service:/app
    ports:
      - "8001:8001"
    networks:
      - attrition_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # React Frontend (Production Build)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        - VITE_APP_NAME=${VITE_APP_NAME:-AttritionIQ}
    container_name: attrition_frontend
    restart: unless-stopped
    networks:
      - attrition_network
    depends_on:
      - backend

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: attrition_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - attrition_network
    depends_on:
      - frontend
      - backend
      - ml_service
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
